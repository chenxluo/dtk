<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DTK · Danbooru Tag Knowledge</title>
  <style>
    :root {
      --paper: #f2f5f7;
      --surface: #ffffff;
      --ink: #17222b;
      --muted: #5f6d79;
      --line: #cbd5dc;
      --accent: #086d78;
      --accent-soft: #dff4f6;
      --general: #007482;
      --artist: #a84846;
      --copyright: #75519f;
      --character: #2d7444;
      --meta: #a36616;
      --mono: Consolas, "Cascadia Mono", "Sarasa Mono SC", monospace;
      --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #101820;
        --surface: #17222b;
        --ink: #e9f0f4;
        --muted: #9dadb8;
        --line: #30404b;
        --accent: #74d7e2;
        --accent-soft: #173238;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.55;
    }

    .shell { width: min(1080px, calc(100% - 32px)); margin: 0 auto; }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .header-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding: 30px 0 20px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    h1 small {
      display: block;
      margin-top: 5px;
      font: 500 13px/1.3 var(--mono);
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .service-status {
      flex: 0 0 auto;
      max-width: 300px;
      font-size: 13px;
      color: var(--muted);
      text-align: right;
    }
    .service-status strong { color: var(--ink); font-weight: 650; }

    .search-panel { margin: 26px 0 12px; }
    .query-grid { display: grid; grid-template-columns: 1fr 112px; gap: 10px; }
    input[type="search"], select, button {
      font: inherit;
      color: inherit;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 4px;
    }
    input[type="search"] {
      width: 100%;
      min-height: 50px;
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 17px;
    }
    input[type="search"]:focus-visible, select:focus-visible, button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    button { cursor: pointer; }
    button[type="submit"] {
      min-height: 50px;
      background: var(--accent);
      border-color: var(--accent);
      color: var(--paper);
      font-weight: 700;
    }
    .query-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .example {
      padding: 4px 8px;
      font-size: 12px;
      color: var(--ink);
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
    }
    select { min-height: 34px; padding: 4px 8px; margin-left: auto; }

    .status-line {
      min-height: 28px;
      margin: 0;
      padding: 4px 2px;
      color: var(--muted);
      font-size: 14px;
    }
    .status-line.error { color: var(--artist); }

    .results {
      display: grid;
      gap: 9px;
      margin: 0 0 48px;
      padding: 0;
      list-style: none;
    }
    .result {
      display: grid;
      grid-template-columns: 46px 1fr auto;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid var(--tag-color, var(--accent));
      border-radius: 3px;
    }
    .result-index {
      font-family: var(--mono);
      color: var(--muted);
      font-size: 13px;
      padding-top: 4px;
    }
    .result-main { min-width: 0; }
    .tag-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    code.tag {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      overflow-wrap: anywhere;
    }
    .chip {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 999px;
      color: #fff;
      background: var(--tag-color, var(--muted));
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .meta { margin-top: 5px; color: var(--muted); font-size: 12.5px; }
    .excerpt { margin: 8px 0 0; font-size: 14px; color: var(--ink); }
    .actions { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
    .actions button { min-width: 70px; min-height: 30px; font-size: 12px; }
    details.tag-detail { margin-top: 10px; }
    details.tag-detail summary { color: var(--accent); cursor: pointer; font-size: 13px; }
    .detail-body { margin-top: 6px; white-space: pre-wrap; font-size: 13.5px; }
    .result.group { display: block; border-left-color: var(--accent); }
    .group-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
    }
    .group-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--accent);
    }
    .group-query { font-weight: 650; overflow-wrap: anywhere; }
    .group-meta { color: var(--muted); font-size: 12.5px; }
    .group-results {
      display: grid;
      gap: 8px;
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }
    .group-empty { color: var(--muted); font-size: 13px; }
    .empty {
      padding: 36px;
      text-align: center;
      background: var(--surface);
      border: 1px dashed var(--line);
      color: var(--muted);
    }

    @media (max-width: 680px) {
      .header-row { align-items: start; flex-direction: column; gap: 10px; }
      .service-status { text-align: left; }
      .query-grid { grid-template-columns: 1fr; }
      .result { grid-template-columns: 1fr; }
      .result-index { display: none; }
      .actions { flex-direction: row; }
      select { margin-left: 0; }
    }

    @media (prefers-reduced-motion: no-preference) {
      button[type="submit"]:active { transform: translateY(1px); }
    }
  </style>
</head>
<body>
<header>
  <div class="shell header-row">
    <div>
      <h1>Danbooru Tag Knowledge<small>DTK · TAG LEDGER</small></h1>
    </div>
    <div class="service-status" id="service-status">正在连接本地知识库…</div>
  </div>
</header>

<main class="shell">
  <section class="search-panel" aria-label="Tag 查询">
    <form id="search-form" class="query-grid">
      <input
        id="query"
        name="query"
        type="search"
        autocomplete="off"
        placeholder="输入自然语言、英文 Tag 或别名"
        aria-label="查询 Tag"
        required
      >
      <button type="submit">查询</button>
    </form>
    <div class="query-tools">
      <span>示例</span>
      <button class="example" type="button" data-query="角色直视观众">角色直视观众</button>
      <button class="example" type="button" data-query="非常长的头发">非常长的头发</button>
      <button class="example" type="button" data-query="traditional japanese wide trouser skirt">hakama 描述</button>
      <button class="example" type="button" data-query="角色直视观众，非常长的头发">多概念</button>
      <label>
        结果数
        <select id="limit" aria-label="返回结果数">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
      </label>
    </div>
  </section>

  <p class="status-line" id="status" role="status" aria-live="polite">输入描述或选择示例开始查询。</p>
  <ul class="results" id="results" aria-label="查询结果"></ul>
</main>

<script>
'use strict';
const form = document.getElementById('search-form');
const queryInput = document.getElementById('query');
const limitInput = document.getElementById('limit');
const statusLine = document.getElementById('status');
const resultsList = document.getElementById('results');
const serviceStatus = document.getElementById('service-status');
const numberFormat = new Intl.NumberFormat('zh-CN');
const matchLabels = {
  exact_name: '精确名称',
  alias: '别名',
  full_text: '全文',
  vector: '语义',
  hybrid: '混合',
  grouped: '分组'
};

function setBusy(text) {
  statusLine.classList.remove('error');
  statusLine.textContent = text;
}

function setError(text) {
  statusLine.classList.add('error');
  statusLine.textContent = text;
}

function categoryColor(type) {
  const colors = {
    general: 'var(--general)',
    artist: 'var(--artist)',
    copyright: 'var(--copyright)',
    character: 'var(--character)',
    meta: 'var(--meta)'
  };
  return colors[type] || 'var(--muted)';
}

function makeElement(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

async function loadTagDetail(name, container, button) {
  button.disabled = true;
  try {
    const response = await fetch(`/api/tag?name=${encodeURIComponent(name)}`);
    const record = await response.json();
    if (!response.ok) throw new Error(record.error || '读取详情失败');
    const details = makeElement('details', 'tag-detail');
    const summary = makeElement('summary', '', '完整释义与别名');
    const body = makeElement('div', 'detail-body');
    body.textContent = record.wiki || '(此 Tag 在当前快照中没有 Wiki)';
    if (record.aliases?.length) {
      body.textContent += `\n\n别名：${record.aliases.join('、')}`;
    }
    details.append(summary, body);
    container.append(details);
    button.textContent = '已展开';
  } catch (error) {
    setError(error.message);
    button.disabled = false;
  }
}

function renderResult(item, index) {
  const row = makeElement('li', 'result');
  row.style.setProperty('--tag-color', categoryColor(item.type));

  const indexNode = makeElement('div', 'result-index', String(index).padStart(2, '0'));
  const main = makeElement('div', 'result-main');
  const tagLine = makeElement('div', 'tag-line');
  tagLine.append(
    makeElement('code', 'tag', item.tag),
    makeElement('span', 'chip', item.type)
  );

  const meta = makeElement('div', 'meta');
  const matchText = matchLabels[item.matched_by] || item.matched_by;
  const scoreText = item.match_score === undefined ? '' : ` · score ${Number(item.match_score).toFixed(4)}`;
  const aliasText = item.matched_alias ? ` · 命中别名 ${item.matched_alias}` : '';
  meta.textContent = `${matchText} · ${numberFormat.format(item.post_count)} 图${scoreText}${aliasText}`;

  main.append(tagLine, meta);
  if (item.wiki_excerpt) main.append(makeElement('p', 'excerpt', item.wiki_excerpt));

  const actions = makeElement('div', 'actions');
  const copyButton = makeElement('button', '', '复制');
  copyButton.type = 'button';
  copyButton.addEventListener('click', async () => {
    await navigator.clipboard.writeText(item.tag);
    copyButton.textContent = '已复制';
  });
  const detailButton = makeElement('button', '', '详情');
  detailButton.type = 'button';
  detailButton.addEventListener('click', () => {
    loadTagDetail(item.tag, main, detailButton);
  });
  actions.append(copyButton, detailButton);
  row.append(indexNode, main, actions);
  return row;
}

function renderGroup(group, groupIndex) {
  const wrapper = makeElement('li', 'result group');
  const head = makeElement('div', 'group-head');
  const label = makeElement('span', 'group-label', `CONCEPT ${String(groupIndex).padStart(2, '0')}`);
  const query = makeElement('span', 'group-query', group.query);
  const matchText = matchLabels[group.matched_by] || group.matched_by;
  const meta = makeElement('span', 'group-meta', `${matchText} · ${group.results.length} 条`);
  head.append(label, query, meta);
  const rows = makeElement('ul', 'group-results');
  group.results.forEach((item, index) => rows.append(renderResult(item, index + 1)));
  if (!group.results.length) rows.append(makeElement('li', 'group-empty', '这个概念没有匹配 Tag。'));
  wrapper.append(head, rows);
  return wrapper;
}

async function runSearch(event) {
  event.preventDefault();
  const query = queryInput.value.trim();
  if (!query) return;
  setBusy('正在查询…');
  resultsList.replaceChildren();
  try {
    const params = new URLSearchParams({query, limit: limitInput.value});
    const response = await fetch(`/api/search?${params}`);
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || '查询失败');
    if (result.groups) {
      result.groups.forEach((group, index) => resultsList.append(renderGroup(group, index + 1)));
      const total = result.groups.reduce((sum, group) => sum + group.results.length, 0);
      setBusy(`完成 · 分组 · ${result.groups.length} 组 · ${total} 条`);
      return;
    }
    const rows = result.results || [];
    rows.forEach((item, index) => resultsList.append(renderResult(item, index + 1)));
    if (!rows.length) {
      const empty = makeElement('li', 'empty', '当前快照没有匹配的 Tag。可以换一种画面描述，或直接输入英文 Tag。');
      resultsList.append(empty);
    }
    setBusy(`完成 · ${matchLabels[result.matched_by] || result.matched_by} · 返回 ${rows.length} 条`);
  } catch (error) {
    setError(error.message);
  }
}

async function loadHealth() {
  try {
    const response = await fetch('/health');
    const health = await response.json();
    if (!health.semantic) {
      serviceStatus.innerHTML = '';
      serviceStatus.append('当前模式：FTS 词典');
      return;
    }
    serviceStatus.innerHTML = '';
    serviceStatus.append(
      '语义检索：',
      Object.assign(document.createElement('strong'), {textContent: '开启'}),
      ` · ${numberFormat.format(health.indexed_tags)} Tag`
    );
  } catch {
    serviceStatus.textContent = '本地服务未就绪';
  }
}

document.querySelectorAll('.example').forEach((button) => {
  button.addEventListener('click', () => {
    queryInput.value = button.dataset.query;
    form.requestSubmit();
  });
});
form.addEventListener('submit', runSearch);
loadHealth();
</script>
</body>
</html>
