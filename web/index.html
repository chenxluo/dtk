<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danbooru Tag Knowledge（DTK）</title>
  <meta name="description" content="把画面描述翻译成 Danbooru 正式 Tag 的本地知识库：语义检索、全文、别名与官方 Wiki。">
  <script>try { const m = localStorage.getItem('dtk-mode'); if (m) document.documentElement.dataset.mode = m; } catch {}</script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css">
  <style>
    /* Hallmark · nav: kept, one header row · signature: the ruled tag ledger, colour means category, ledger glyph mark · states: busy, empty, error, full, degraded · modes: light + dark (auto + toggle) · ink: paper · shared tokens/base live in /assets/app.css since the /lab page */
    /* Hallmark · axes: light/grotesk-sans/chromatic-teal · posture: restrained · job: query tags · built: 2026-11-13 */
    /* Hallmark · pre-emit critique: P4 H4 E4 S4 R5 V4 · weakest: E, a one-field header can read bare; carried by the ink-ruled ledger opening and the printed-notice error state */
    /* Hallmark · reworded "danbooru tag knowledge dtk · tag ledger" to "danbooru tag knowledge dtk tag ledger" · 63 and 67 name the tracked-caps, dot-joined label */
    /* Hallmark · finish-review: subagent, ship · 5 findings · 4 resolved, 1 guard (category hues stay inside the squares) · light set recaptured on the record */
    .service-status { flex: 0 0 auto; max-width: 300px; font-size: var(--text-sm); color: var(--color-muted); text-align: right; }
    .service-status strong { color: var(--color-ink); font-weight: 600; }
    .config { position: relative; }
    .config > summary { display: inline-flex; align-items: center; list-style: none; }
    .config > summary::-webkit-details-marker { display: none; }
    .config[open] > summary { background: var(--color-paper-2); }
    .config-panel {
      position: absolute; right: 0; top: calc(100% + var(--space-xs)); z-index: var(--z-dropdown);
      width: 22rem; max-width: 70vw;
      padding: var(--space-md);
      background: var(--color-paper); color: var(--color-ink);
      border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    }
    .config-panel dl { margin: 0; }
    .config-panel .row {
      display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-md);
      padding-block: var(--space-2xs); border-bottom: var(--rule-hair) solid var(--color-rule-2);
    }
    .config-panel .row:last-of-type { border-bottom: none; }
    .config-panel dt { font-size: var(--text-sm); color: var(--color-muted); }
    .config-panel dd { margin: 0; font-size: var(--text-sm); color: var(--color-ink); text-align: right; min-width: 0; overflow-wrap: break-word; }
    .config-panel dd.code { font-family: var(--font-outlier); font-size: var(--text-xs); }
    .config-panel dd.down { color: var(--color-ink); font-weight: 600; }
    .config-panel .switch { display: flex; align-items: center; gap: var(--space-2xs); font-size: var(--text-sm); color: var(--color-ink); cursor: pointer; }
    .config-panel .switch input { accent-color: var(--color-accent); }
    .config-form { display: grid; gap: var(--space-2xs); margin-top: var(--space-sm); }
    .config-form label { display: grid; gap: var(--space-3xs); font-size: var(--text-sm); color: var(--color-muted); }
    .config-form input {
      width: 100%; min-height: 2rem; padding: var(--space-3xs) var(--space-2xs);
      font-family: var(--font-outlier); font-size: var(--text-sm); color: var(--color-ink);
      background: var(--color-paper); border: var(--rule-hair) solid var(--color-muted); border-radius: 8px;
    }
    .config-form input:hover { background: var(--color-paper-2); }
    .config-form input:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -3px; border-color: var(--color-ink-2); }
    .config-form button[type="submit"] {
      min-height: 2rem; margin-top: var(--space-2xs);
      font-weight: 600; font-size: var(--text-sm); color: var(--color-ink);
      background: var(--color-paper); border: var(--rule-hair) solid var(--color-rule); border-radius: 10px;
      transition: background-color var(--dur-micro) var(--ease-out);
    }
    .config-form button[type="submit"]:hover { background: var(--color-paper-2); border-color: var(--color-ink-2); }
    .config-form button[type="submit"]:active { background: var(--color-paper-3); }
    .config-form .form-note { margin: 0; font-size: var(--text-xs); color: var(--color-muted); }

    .search-panel { margin: var(--space-lg) 0 var(--space-sm); }
    .query-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-sm); }
    input[type="search"] {
      width: 100%; min-height: 2.75rem; padding: var(--space-2xs) var(--space-sm);
      font-family: var(--font-body); font-size: var(--text-md); color: var(--color-ink);
      background: var(--color-paper); border: var(--rule-hair) solid var(--color-muted);
      border-radius: 10px; outline: 2px solid transparent; outline-offset: -3px;
    }
    input[type="search"]::placeholder { color: var(--color-muted); }
    input[type="search"]:hover { background: var(--color-paper-2); }
    input[type="search"]:focus-visible { outline-color: var(--color-focus); border-color: var(--color-ink-2); }
    select {
      min-height: 2rem; padding: var(--space-3xs) var(--space-2xs);
      color: var(--color-ink); background: var(--color-paper);
      border: var(--rule-hair) solid var(--color-muted); border-radius: 10px;
    }
    button { cursor: pointer; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button[type="submit"] {
      min-height: 2.75rem; padding-inline: var(--space-lg);
      font-weight: 600; color: var(--color-paper);
      background: var(--color-ink); border: var(--rule-hair) solid var(--color-ink);
      border-radius: 10px;
      transition: background-color var(--dur-micro) var(--ease-out);
    }
    button[type="submit"]:hover { background: var(--color-ink-2); border-color: var(--color-ink-2); }
    button[type="submit"]:active { background: var(--color-ink-2); }
    .query-tools {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: var(--space-xs); margin-top: var(--space-sm);
      color: var(--color-muted); font-size: var(--text-sm);
    }
    .example {
      position: relative; min-height: 2rem; padding: var(--space-2xs) var(--space-sm);
      font-size: var(--text-sm); color: var(--color-ink-2);
      background: var(--color-paper); border: var(--rule-hair) solid var(--color-rule); border-radius: 10px;
      transition: background-color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out);
    }
    .example::before { content: ""; position: absolute; inset: -6px; }
    .example:hover { background: var(--color-paper-2); border-color: var(--color-rule); }
    .example:active { background: var(--color-paper-3); }
    .query-tools label { margin-left: auto; display: flex; align-items: center; gap: var(--space-2xs); }

    .status-line {
      min-height: 1lh; margin: var(--space-sm) 0; padding: var(--space-2xs) var(--space-3xs);
      color: var(--color-muted); font-size: var(--text-sm);
    }
    .status-line.error {
      display: inline-block; padding: var(--space-sm) var(--space-md);
      background: var(--color-paper-2); border: var(--rule-hair) solid var(--color-ink);
      border-radius: 10px; color: var(--color-ink); font-weight: 600;
    }

    .results {
      margin: var(--space-lg) 0 var(--space-2xl); padding: 0; list-style: none;
      border-top: var(--rule-hair) solid var(--color-ink);
    }
    .result {
      position: relative;
      display: grid; grid-template-columns: 3.5rem minmax(0, 1fr) auto;
      gap: var(--space-md); align-items: start;
      padding-block: var(--space-sm);
      border-bottom: var(--rule-hair) solid var(--color-rule);
    }
    .result-index {
      display: flex; align-items: center; gap: var(--space-2xs); padding-top: var(--space-2xs);
      font-family: var(--font-outlier); font-size: var(--text-sm); color: var(--color-muted);
    }
    .result-index::before {
      content: ""; display: block; flex: 0 0 auto; width: 10px; height: 10px;
      border-radius: 2px; background: var(--tag-color, var(--color-muted));
    }
    .result-main { min-width: 0; }
    .tag-line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs); }
    code.tag {
      font-family: var(--font-outlier); font-weight: 600; font-size: var(--text-md);
      color: var(--color-ink); overflow-wrap: break-word;
    }
    .chip {
      display: inline-flex; align-items: center; padding: var(--space-3xs) var(--space-xs);
      border-radius: var(--radius-pill); font-size: var(--text-xs); color: var(--color-ink-2);
      box-shadow: inset 0 0 0 var(--rule-hair) var(--color-rule);
    }
    .chip.cn { background: var(--color-paper-3); box-shadow: none; color: var(--color-ink-2); }
    .meta { margin-top: var(--space-2xs); color: var(--color-ink-2); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
    .excerpt { margin: var(--space-xs) 0 0; max-width: 65ch; font-size: var(--text-md); color: var(--color-ink-2); }
    .actions { display: flex; flex-direction: column; align-items: stretch; gap: var(--space-2xs); padding-top: var(--space-2xs); }
    .actions button {
      min-height: 2rem; padding: var(--space-2xs) var(--space-sm); min-width: 4.5rem;
      font-size: var(--text-sm); color: var(--color-ink-2);
      background: var(--color-paper); border: var(--rule-hair) solid var(--color-rule); border-radius: 10px;
      transition: background-color var(--dur-micro) var(--ease-out);
    }
    .actions button:hover { background: var(--color-paper-2); }
    .actions button:active { background: var(--color-paper-3); }
    .tag-detail {
      position: absolute; top: 100%; left: 0; right: 0; z-index: var(--z-dropdown);
      background: var(--color-paper);
      border-radius: var(--radius-card); overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    .detail-head {
      display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs);
      padding: var(--space-sm) var(--space-md);
      background: var(--color-paper-2); border-bottom: var(--rule-hair) solid var(--color-rule);
    }
    .detail-head .tag { font-size: var(--text-lg); }
    .ext-link {
      display: inline-flex; align-items: center; min-height: 2rem; margin-left: auto;
      padding: var(--space-3xs) var(--space-xs); border-radius: 10px;
      font-size: var(--text-sm); color: var(--color-ink-2); text-decoration: none;
      border: var(--rule-hair) solid var(--color-rule);
      transition: background-color var(--dur-micro) var(--ease-out);
    }
    .ext-link:hover { background: var(--color-paper); border-color: var(--color-rule); color: var(--color-ink); }
    .detail-rows { margin: 0; padding: var(--space-2xs) var(--space-md); }
    .detail-rows .row {
      display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: var(--space-sm);
      padding-block: var(--space-2xs); border-bottom: var(--rule-hair) solid var(--color-rule-2);
    }
    .detail-rows .row:last-child { border-bottom: none; }
    .detail-rows dt { padding-top: var(--space-3xs); font-size: var(--text-sm); color: var(--color-muted); }
    .detail-rows dd { margin: 0; min-width: 0; font-size: var(--text-sm); line-height: 1.6; color: var(--color-ink-2); overflow-wrap: break-word; }
    .detail-rows dd.def { font-size: var(--text-md); color: var(--color-ink); }
    .detail-rows dd .wiki { white-space: pre-wrap; }
    .detail-rows dd .pub { display: block; margin-top: var(--space-2xs); font-size: var(--text-xs); color: var(--color-muted); }
    .detail-rows dd ul { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--space-2xs); }
    .detail-rows dd ul li { display: flex; flex-direction: column; gap: var(--space-3xs); }
    .detail-rows dd ul .kind { font-size: var(--text-xs); color: var(--color-muted); }
    .detail-rows dd ul a { color: var(--color-ink); font-size: var(--text-xs); }
    .detail-rows dd .terms { font-family: var(--font-outlier); font-size: var(--text-xs); line-height: 1.8; overflow-wrap: anywhere; }
    .result.group { display: block; padding-block: var(--space-sm); }
    .group-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-xs); }
    .group-label { font-size: var(--text-xs); color: var(--color-muted); }
    .group-query { font-weight: 600; overflow-wrap: break-word; }
    .group-meta { color: var(--color-muted); font-size: var(--text-sm); }
    .group-results {
      margin: var(--space-sm) 0 0; padding: 0; list-style: none;
      border-top: var(--rule-hair) solid var(--color-rule);
    }
    .group-results .result { border-bottom: var(--rule-hair) solid var(--color-rule-2); }
    .group-empty { padding-block: var(--space-sm); color: var(--color-muted); font-size: var(--text-sm); }
    .empty { padding: var(--space-xl) var(--space-md); text-align: center; color: var(--color-muted); }

    .guide { padding: var(--space-lg) 0 var(--space-md); }
    .page-foot { padding-block: var(--space-sm) var(--space-lg); }
    .page-foot a { font-size: var(--text-sm); color: var(--color-muted); }
    .page-foot a:hover { color: var(--color-ink); }
    .guide p { color: var(--color-ink-2); }
    .legend { display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-md); margin: var(--space-md) 0 0; padding: 0; list-style: none; }
    .legend li { display: flex; align-items: center; gap: var(--space-2xs); font-size: var(--text-sm); color: var(--color-muted); }
    .legend i { width: 10px; height: 10px; border-radius: 2px; }
    .legend .sw-general { background: var(--general); }
    .legend .sw-artist { background: var(--artist); }
    .legend .sw-copyright { background: var(--copyright); }
    .legend .sw-character { background: var(--character); }
    .legend .sw-meta { background: var(--meta); }

    .service-status .on {
      display: inline-block; padding: var(--space-3xs) var(--space-xs); margin-inline: var(--space-3xs);
      border-radius: var(--radius-pill); background: var(--color-accent-soft); color: var(--color-accent-soft-ink);
      font-weight: 600; font-size: var(--text-xs);
    }
    @media (max-width: 42.5rem) {
      .header-row { align-items: start; flex-direction: column; gap: var(--space-2xs); }
      h1 { white-space: normal; max-width: 20ch; }
      .service-status { text-align: left; }
      .query-grid { grid-template-columns: minmax(0, 1fr); }
      .result { grid-template-columns: minmax(0, 1fr); }
      .actions { flex-direction: row; padding-top: 0; }
      .query-tools label { margin-left: 0; }
      .detail-rows .row { grid-template-columns: 1fr; gap: var(--space-3xs); }
      .detail-rows dt { padding-top: 0; }
    }
  </style>
</head>
<body>
<header>
  <div class="shell header-row">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true" focusable="false">
        <rect x="2.75" y="2.75" width="18.5" height="18.5" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <rect x="7.9" y="7.9" width="3" height="3" rx="0.7" fill="var(--color-accent)"/>
        <line x1="12.7" y1="9.4" x2="16.5" y2="9.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="7.9" y1="13.2" x2="16.5" y2="13.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="7.9" y1="16" x2="14.3" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <h1>Danbooru Tag Knowledge<small>DTK tag ledger</small></h1>
    </div>
    <div class="header-tools">
      <div class="service-status" id="service-status">正在连接本地知识库…</div>
      <button class="mode-toggle" id="mode-toggle" type="button">配色</button>
      <details class="config" id="config">
        <summary>配置</summary>
        <div class="config-panel">
          <dl>
            <div class="row"><dt>语义索引</dt><dd id="cfg-index">…</dd></div>
            <div class="row"><dt>服务状态</dt><dd id="cfg-state">…</dd></div>
            <div class="row"><dt>复制格式</dt><dd><label class="switch"><input type="checkbox" id="cfg-copy-space" checked>下划线转空格</label></dd></div>
          </dl>
          <form class="config-form" id="config-form">
            <label>嵌入服务<input type="url" id="cfg-base-url" autocomplete="off" spellcheck="false"></label>
            <label>嵌入模型<input type="text" id="cfg-model-input" autocomplete="off" spellcheck="false"></label>
            <label>嵌入 API Key<input type="password" id="cfg-embed-key" autocomplete="new-password" placeholder="未设置"></label>
            <label>研究 API Key<input type="password" id="cfg-research-key" autocomplete="new-password" placeholder="未设置"></label>
            <label>SearxNG<input type="url" id="cfg-searx" autocomplete="off" spellcheck="false"></label>
            <button type="submit">保存配置</button>
            <p class="form-note" id="config-form-note">保存到 data/dtk.json，重启服务后生效；环境变量优先于此文件。</p>
          </form>
        </div>
      </details>
    </div>
  </div>
</header>

<main class="shell">
  <section class="search-panel" aria-label="Tag 查询">
    <form id="search-form" class="query-grid">
      <input
        id="query"
        name="query"
        type="search"
        autocomplete="off"
        placeholder="输入自然语言、英文 Tag 或别名"
        aria-label="查询 Tag"
        required
      >
      <button type="submit">查询</button>
    </form>
    <div class="query-tools">
      <span>示例</span>
      <button class="example" type="button" data-query="角色直视观众">角色直视观众</button>
      <button class="example" type="button" data-query="非常长的头发">非常长的头发</button>
      <button class="example" type="button" data-query="traditional japanese wide trouser skirt">hakama 描述</button>
      <button class="example" type="button" data-query="角色直视观众，非常长的头发">多概念</button>
      <label>
        结果数
        <select id="limit" aria-label="返回结果数">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
      </label>
    </div>
  </section>

  <p class="status-line" id="status" role="status" aria-live="polite"></p>
  <ul class="results" id="results" aria-label="查询结果">
    <li class="guide">
      <p>还没有查询。输入画面描述或英文 Tag，这里会按词条行列出对应的正式 Tag。</p>
      <ul class="legend" aria-label="Tag 类别图例">
        <li><i class="sw-general" aria-hidden="true"></i>general</li>
        <li><i class="sw-artist" aria-hidden="true"></i>artist</li>
        <li><i class="sw-copyright" aria-hidden="true"></i>copyright</li>
        <li><i class="sw-character" aria-hidden="true"></i>character</li>
        <li><i class="sw-meta" aria-hidden="true"></i>meta</li>
      </ul>
    </li>
  </ul>
</main>

<footer class="shell page-foot">
  <a href="/lab">高级 · 统计</a>
</footer>

<script>
'use strict';
const form = document.getElementById('search-form');
const queryInput = document.getElementById('query');
const limitInput = document.getElementById('limit');
const statusLine = document.getElementById('status');
const resultsList = document.getElementById('results');
const serviceStatus = document.getElementById('service-status');
const modeToggle = document.getElementById('mode-toggle');
const configState = document.getElementById('cfg-state');
const copySpaceToggle = document.getElementById('cfg-copy-space');
const configForm = document.getElementById('config-form');
const configFormNote = document.getElementById('config-form-note');
const configInputs = {
  embedding_base_url: document.getElementById('cfg-base-url'),
  embedding_model: document.getElementById('cfg-model-input'),
  embedding_api_key: document.getElementById('cfg-embed-key'),
  research_llm_api_key: document.getElementById('cfg-research-key'),
  searx_url: document.getElementById('cfg-searx')
};

function fillConfigForm(config) {
  configInputs.embedding_base_url.value = config.embedding_base_url || '';
  configInputs.embedding_model.value = config.embedding_model || '';
  configInputs.searx_url.value = config.searx_url || '';
  for (const key of ['embedding_api_key', 'research_llm_api_key']) {
    const input = configInputs[key];
    input.value = '';
    input.placeholder = config[key] ? `已设置（${config[key]}）` : '未设置';
  }
}

async function loadConfig() {
  try {
    const response = await fetch('/api/config');
    fillConfigForm(await response.json());
  } catch {
    configFormNote.textContent = '配置读取失败。';
  }
}

configForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const updates = {};
  for (const [key, input] of Object.entries(configInputs)) {
    if (input.type === 'password') {
      if (input.value) updates[key] = input.value;
    } else if (input.value) {
      updates[key] = input.value;
    }
  }
  try {
    const response = await fetch('/api/config', {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(updates)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || '保存失败');
    fillConfigForm(result.config);
    configFormNote.textContent = '已保存，重启服务后生效；环境变量优先于此文件。';
  } catch (error) {
    configFormNote.textContent = `保存失败：${error.message}`;
  }
});

try { copySpaceToggle.checked = localStorage.getItem('dtk-copy-space') !== '0'; } catch {}
copySpaceToggle.addEventListener('change', () => {
  try { localStorage.setItem('dtk-copy-space', copySpaceToggle.checked ? '1' : '0'); } catch {}
});
let semanticEnabled = false;

function currentModeDark() {
  const mode = document.documentElement.dataset.mode;
  return mode ? mode === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function applyModeLabel() {
  modeToggle.textContent = currentModeDark() ? '亮色' : '暗色';
}

modeToggle.addEventListener('click', () => {
  const next = currentModeDark() ? 'light' : 'dark';
  document.documentElement.dataset.mode = next;
  try { localStorage.setItem('dtk-mode', next); } catch {}
  applyModeLabel();
});

const numberFormat = new Intl.NumberFormat('zh-CN');
const matchLabels = {
  exact_name: '精确名称',
  alias: '别名',
  full_text: '全文',
  vector: '语义',
  hybrid: '混合',
  no_match: '无匹配',
  grouped: '分组'
};

function setBusy(text) {
  statusLine.classList.remove('error');
  statusLine.textContent = text;
}

function setError(text) {
  statusLine.classList.add('error');
  statusLine.textContent = text;
}

function categoryColor(type) {
  const colors = {
    general: 'var(--general)',
    artist: 'var(--artist)',
    copyright: 'var(--copyright)',
    character: 'var(--character)',
    meta: 'var(--meta)'
  };
  return colors[type] || 'var(--muted)';
}

function makeElement(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function closeDetailCard(card) {
  card.remove();
  if (card._button) {
    card._button.textContent = '详情';
    card._button.setAttribute('aria-expanded', 'false');
  }
}

async function loadTagDetail(name, container, button) {
  const existing = container.querySelector('.tag-detail');
  if (existing) {
    closeDetailCard(existing);
    return;
  }
  document.querySelectorAll('.tag-detail').forEach(closeDetailCard);
  button.disabled = true;
  button.textContent = '读取中…';
  try {
    const response = await fetch(`/api/tag?name=${encodeURIComponent(name)}`);
    const record = await response.json();
    if (!response.ok) throw new Error(record.error || '读取详情失败');

    const card = makeElement('section', 'tag-detail');
    const head = makeElement('div', 'detail-head');
    head.append(makeElement('code', 'tag', record.tag));
    head.append(makeElement('span', 'chip', record.type));
    if (record.cn_name) head.append(makeElement('span', 'chip cn', record.cn_name));
    const ext = makeElement('a', 'ext-link', 'Danbooru 词条 ↗');
    ext.href = `https://danbooru.donmai.us/wiki_pages/${encodeURIComponent(record.tag)}`;
    ext.target = '_blank';
    ext.rel = 'noopener';
    head.append(ext);

    const rows = makeElement('dl', 'detail-rows');
    const addRow = (label, ...nodes) => {
      const row = makeElement('div', 'row');
      const dd = makeElement('dd');
      nodes.flat().forEach((node) => node && dd.append(node));
      if (!dd.childNodes.length) return;
      row.append(makeElement('dt', '', label), dd);
      rows.append(row);
    };

    if (record.cn_definition) {
      addRow('中文定义', makeElement('p', 'def', record.cn_definition));
    }
    if (record.wiki) {
      const wiki = makeElement('div', 'wiki', record.wiki);
      const source = makeElement(
        'span', 'pub',
        record.wiki_source === 'upstream' ? '来源：官方线上 Wiki' : '来源：快照收录'
      );
      addRow('官方 Wiki', wiki, source);
    }
    if (record.research) {
      const def = makeElement('p', 'def', record.research.definition_zh);
      const pub = makeElement('span', 'pub', `发布于 ${String(record.research.published_at).slice(0, 10)}`);
      addRow('研究定义', def, pub);
      if (record.research.documents?.length) {
        const docs = makeElement('ul');
        record.research.documents.forEach((doc) => {
          const item = makeElement('li');
          item.append(makeElement('span', 'kind', `${doc.kind} · ${doc.language}`));
          item.append(makeElement('span', '', doc.text));
          docs.append(item);
        });
        addRow('语义表达', docs);
      }
      if (record.research.evidence?.length) {
        const items = makeElement('ul');
        record.research.evidence.forEach((item) => {
          const li = makeElement('li');
          li.append(makeElement('span', '', item.quote));
          const link = makeElement('a', '', '来源 ↗');
          link.href = item.url;
          link.target = '_blank';
          link.rel = 'noopener';
          li.append(link);
          items.append(li);
        });
        addRow('证据', items);
      }
    }
    if (record.aliases?.length) {
      addRow('别名', makeElement('p', 'terms', record.aliases.join('、')));
    }
    if (record.other_names?.length) {
      addRow('官方别名', makeElement('p', 'terms', record.other_names.join('、')));
    }
    if (record.search_terms?.length) {
      addRow('检索联想', makeElement('p', 'terms', record.search_terms.join('、')));
    }
    if (record.implications?.implies?.length) {
      addRow('联动 →', makeElement('p', 'terms', record.implications.implies.join('、')));
    }
    if (record.implications?.implied_by?.length) {
      addRow('联动 ←', makeElement('p', 'terms', record.implications.implied_by.join('、')));
    }

    card.append(head, rows);
    card._button = button;
    container.append(card);
    button.textContent = '收起';
    button.disabled = false;
    button.setAttribute('aria-expanded', 'true');
  } catch (error) {
    setError(error.message);
    button.disabled = false;
    button.textContent = '详情';
  }
}

document.addEventListener('click', (event) => {
  document.querySelectorAll('.tag-detail').forEach((card) => {
    if (!card.contains(event.target) && card._button !== event.target) closeDetailCard(card);
  });
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') document.querySelectorAll('.tag-detail').forEach(closeDetailCard);
});

function renderResult(item, index) {
  const row = makeElement('li', 'result');
  row.style.setProperty('--tag-color', categoryColor(item.type));

  const indexNode = makeElement('div', 'result-index', String(index).padStart(2, '0'));
  const main = makeElement('div', 'result-main');
  const tagLine = makeElement('div', 'tag-line');
  tagLine.append(
    makeElement('code', 'tag', item.tag),
    makeElement('span', 'chip', item.type)
  );
  if (item.cn_name) {
    tagLine.append(makeElement('span', 'chip cn', item.cn_name));
  }

  const meta = makeElement('div', 'meta');
  const matchText = matchLabels[item.matched_by] || item.matched_by;
  const scoreText = item.match_score === undefined ? '' : `，score ${Number(item.match_score).toFixed(4)}`;
  const aliasText = item.matched_alias ? `，命中别名 ${item.matched_alias}` : '';
  meta.textContent = `${matchText}，${numberFormat.format(item.post_count)} 图${scoreText}${aliasText}`;

  main.append(tagLine, meta);
  if (item.wiki_excerpt) main.append(makeElement('p', 'excerpt', item.wiki_excerpt));

  const actions = makeElement('div', 'actions');
  const copyButton = makeElement('button', '', '复制');
  copyButton.type = 'button';
  copyButton.addEventListener('click', async () => {
    const text = copySpaceToggle.checked ? item.tag.replace(/_/g, ' ') : item.tag;
    await navigator.clipboard.writeText(text);
    copyButton.textContent = '已复制';
  });
  const detailButton = makeElement('button', '', '详情');
  detailButton.type = 'button';
  detailButton.setAttribute('aria-expanded', 'false');
  detailButton.addEventListener('click', () => {
    loadTagDetail(item.tag, main, detailButton);
  });
  actions.append(copyButton, detailButton);
  row.append(indexNode, main, actions);
  return row;
}

function renderGroup(group, groupIndex) {
  const wrapper = makeElement('li', 'result group');
  const head = makeElement('div', 'group-head');
  const label = makeElement('span', 'group-label', `概念 ${String(groupIndex).padStart(2, '0')}`);
  const query = makeElement('span', 'group-query', group.query);
  const matchText = matchLabels[group.matched_by] || group.matched_by;
  const meta = makeElement('span', 'group-meta', `${matchText}，${group.results.length} 条`);
  head.append(label, query, meta);
  const rows = makeElement('ul', 'group-results');
  group.results.forEach((item, index) => rows.append(renderResult(item, index + 1)));
  if (!group.results.length) rows.append(makeElement('li', 'group-empty', '这个概念没有匹配 Tag。'));
  wrapper.append(head, rows);
  return wrapper;
}

async function runSearch(event) {
  event.preventDefault();
  const query = queryInput.value.trim();
  if (!query) return;
  const submitButton = form.querySelector('button[type="submit"]');
  submitButton.disabled = true;
  const start = performance.now();
  const elapsed = () => `${((performance.now() - start) / 1000).toFixed(1)}s`;
  const tick = setInterval(() => setBusy(`正在查询… ${elapsed()}`), 100);
  resultsList.replaceChildren();
  try {
    const params = new URLSearchParams({query, limit: limitInput.value});
    const response = await fetch(`/api/search?${params}`);
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || '查询失败');
    const degradedNote = result.degraded ? '（嵌入服务不可用，已跳过语义检索，检查 DTK_LLM_BASE_URL 配置）' : '';
    if (semanticEnabled) {
      configState.classList.toggle('down', !!result.degraded);
      configState.textContent = result.degraded ? '不可用，已回退全文' : '可用';
    }
    if (result.groups) {
      result.groups.forEach((group, index) => resultsList.append(renderGroup(group, index + 1)));
      const total = result.groups.reduce((sum, group) => sum + group.results.length, 0);
      setBusy(`完成：分组，${result.groups.length} 组共 ${total} 条 · ${elapsed()}${degradedNote}`);
      return;
    }
    const rows = result.results || [];
    rows.forEach((item, index) => resultsList.append(renderResult(item, index + 1)));
    if (!rows.length) {
      const empty = makeElement('li', 'empty', '当前快照没有匹配的 Tag。可以换一种画面描述，或直接输入英文 Tag。');
      resultsList.append(empty);
    }
    setBusy(`完成：${matchLabels[result.matched_by] || result.matched_by}，返回 ${rows.length} 条 · ${elapsed()}${degradedNote}`);
  } catch (error) {
    setError(`${error.message} · ${elapsed()}`);
  } finally {
    clearInterval(tick);
    submitButton.disabled = false;
  }
}

async function loadHealth() {
  try {
    const response = await fetch('/health');
    const health = await response.json();
    document.getElementById('cfg-index').textContent = health.semantic
      ? `${numberFormat.format(health.indexed_tags)} Tag`
      : '未构建';
    semanticEnabled = !!health.semantic;
    if (configState.textContent === '…') configState.textContent = health.semantic ? '待查询' : '未启用';
    if (!health.semantic) {
      serviceStatus.innerHTML = '';
      serviceStatus.append('当前模式：FTS 词典');
      return;
    }
    serviceStatus.innerHTML = '';
    serviceStatus.append(
      '语义检索：',
      Object.assign(document.createElement('strong'), {textContent: '开启', className: 'on'}),
      `，共 ${numberFormat.format(health.indexed_tags)} Tag`
    );
  } catch {
    serviceStatus.textContent = '本地服务未就绪';
  }
}

document.querySelectorAll('.example').forEach((button) => {
  button.addEventListener('click', () => {
    queryInput.value = button.dataset.query;
    form.requestSubmit();
  });
});
form.addEventListener('submit', runSearch);
applyModeLabel();
loadHealth();
loadConfig();
</script>
