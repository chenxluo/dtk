[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danbooru-tag-knowledge"
version = "0.4.0"
description = "Entity-centric Danbooru tag knowledge and retrieval service"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gui = ["pywebview>=5"]

[project.scripts]
dtk = "dtk.cli:main"

[tool.setuptools]
packages = ["dtk"]
